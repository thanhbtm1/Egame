<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD BOOM - BẢN SẮC MÀU & PHÁO GIẤY</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ffffff;
            --accent1: #ff007b;
            --accent2: #00f0ff;
            --warning: #ff3300;
            --success: #00ff66;
            --panel-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #120024, #3a0066, #001f4d);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 95%;
            max-width: 1100px;
            background: var(--panel-bg);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.2);
        }

        h1.title {
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ff007b, #00f0ff, #ffdf00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.5));
            letter-spacing: 2px;
        }

        button { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        button:hover:not(:disabled) { transform: translateY(-5px) scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Setup Screen */
        .setup-screen { text-align: center; }
        .setup-screen input {
            padding: 15px; margin: 15px; border-radius: 12px;
            border: 2px solid var(--accent2); background: rgba(0,0,0,0.5);
            color: white; text-align: center; font-size: 1.2rem; outline: none;
        }
        .setup-screen input:focus { box-shadow: 0 0 15px var(--accent2); }

        .btn-main {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 50px;
            background: linear-gradient(45deg, #ff007b, #ff7a00); color: white;
            box-shadow: 0 10px 20px rgba(255,0,123,0.5); margin-top: 20px;
        }

        /* Header Panel */
        .header-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, rgba(255,0,123,0.8), rgba(65,88,208,0.8));
            padding: 20px 40px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3); margin-bottom: 20px;
        }
        .active-team-info { font-size: 1.3rem; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px black; }
        .active-team-name { font-size: 3rem; color: #ffdf00; text-transform: uppercase; text-shadow: 2px 2px 4px black; }
        .steal-badge { display: none; background: #ffdf00; color: black; font-size: 1rem; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-left: 10px; animation: pulse 0.5s infinite; }
        .active-team-score { font-size: 3.5rem; font-weight: 900; color: #00ff66; text-shadow: 2px 2px 5px black; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Lifelines & Timer */
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .timer { font-size: 2.5rem; font-weight: bold; color: white; background: rgba(0,0,0,0.5); padding: 10px 30px; border-radius: 20px; border: 2px solid var(--accent2); }
        .timer.warning { color: white; background: var(--warning); border-color: var(--warning); animation: pulse 0.5s infinite; box-shadow: 0 0 20px var(--warning); }

        .lifelines { display: flex; gap: 10px; }
        .btn-lifeline { background: linear-gradient(45deg, #8e2de2, #4a00e0); color: white; border: 2px solid #fff; padding: 10px 20px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; }
        .btn-lifeline.used { background: #555; color: #888; border-color: #444; text-decoration: line-through; }

        /* Questions */
        .question-box { background: linear-gradient(135deg, rgba(255,0,123,0.3), rgba(0,240,255,0.3)); padding: 40px; border-radius: 20px; text-align: center; border: 2px solid rgba(255,255,255,0.4); position: relative; }
        .question-text { font-size: 2.2rem; margin-bottom: 40px; font-weight: bold; text-shadow: 1px 1px 3px black; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .option-btn {
            background: rgba(0,0,0,0.6); border: 2px solid var(--accent2); color: white; padding: 25px; font-size: 1.5rem; 
            border-radius: 15px; text-align: left; padding-left: 30px; font-weight: 600;
        }
        .option-btn:hover:not(:disabled) { border-color: #fff; background: rgba(0,240,255,0.4); box-shadow: 0 0 20px rgba(0,240,255,0.6); }
        .option-btn.correct { background: var(--success); color: black; border-color: white; transform: scale(1.05); box-shadow: 0 0 30px var(--success); }
        .option-btn.wrong { background: var(--warning); color: white; border-color: white; opacity: 0.6; }
        .option-btn.disabled-5050 { opacity: 0.2; pointer-events: none; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: linear-gradient(135deg, #1f0033, #001a33); border: 3px solid var(--accent2); border-radius: 25px; padding: 50px; text-align: center; width: 80%; max-width: 700px; box-shadow: 0 0 50px rgba(0,240,255,0.3); }
        .steal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .steal-btn { background: #ff007b; border: 2px solid white; color: white; padding: 20px; font-size: 1.5rem; border-radius: 15px; font-weight: bold; }

        .gift-container { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .gift-icon { font-size: 100px; cursor: pointer; transition: 0.3s; animation: float 2s infinite ease-in-out; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        .gift-icon:hover { transform: scale(1.2); filter: drop-shadow(0 0 20px #ffdf00); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .combo-badge { position: absolute; top: -20px; right: 20px; background: #ffdf00; color: black; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 15px #ffdf00; display: none; z-index: 10; }

        /* TỔNG KẾT & VIDEO BÍ MẬT */
        .end-screen { display: none; text-align: center; }
        .rank-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .rank-card { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; font-weight: bold; border: 2px solid var(--accent2); font-size: 1.2rem; }
        .video-container { display: flex; justify-content: space-around; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .video-box { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 20px; flex: 1; min-width: 300px; border: 2px solid white; display: flex; flex-direction: column; }
        
        .secret-box {
            flex-grow: 1; min-height: 250px; background: rgba(0,0,0,0.8);
            border: 2px dashed #fff; border-radius: 15px; margin-top: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; cursor: pointer; transition: 0.3s;
            color: #ffdf00; font-weight: bold; text-shadow: 0 0 10px #ffdf00;
        }
        .secret-box:hover { background: rgba(255,0,123,0.3); transform: scale(1.02); }

    </style>
</head>
<body>
    <audio id="sfx-correct" src="https://www.myinstants.com/media/sounds/correct.mp3"></audio>
    <audio id="sfx-wrong" src="https://www.myinstants.com/media/sounds/wrong-buzzer.mp3"></audio>
    <audio id="sfx-tada" src="https://www.myinstants.com/media/sounds/tada.mp3"></audio>

    <div class="container" id="setup-screen">
        <h1 class="title">ĐẠI CHIẾN TỨ HÙNG</h1>
        <div class="setup-screen">
            <input type="text" id="t0" value="NHÓM 1">
            <input type="text" id="t1" value="NHÓM 2"><br>
            <input type="text" id="t2" value="NHÓM 3">
            <input type="text" id="t3" value="NHÓM 4"><br>
            <button class="btn-main" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        </div>
    </div>

    <div class="container" id="game-screen" style="display: none;">
        <div class="header-panel">
            <div class="active-team-info">
                LƯỢT CỦA: <span id="main-turn-name">NHÓM 1</span> (Câu <span id="q-count">1</span>/3)<br>
                <div style="margin-top: 5px;">
                    <span class="active-team-name" id="display-team-name">NHÓM 1</span>
                    <span class="steal-badge" id="steal-badge">⚡ ĐANG CƯỚP QUYỀN</span>
                </div>
            </div>
            <div class="active-team-score" id="display-team-score">0</div>
        </div>

        <div class="status-bar">
            <div class="timer" id="timer-display">⏳ 20</div>
            <div class="lifelines" id="lifelines-container">
                <button class="btn-lifeline" id="ll-5050" onclick="use5050()">50/50</button>
                <button class="btn-lifeline" id="ll-call" onclick="useCall()">GỌI NGƯỜI THÂN</button>
                <button class="btn-lifeline" id="ll-audience" onclick="useAudience()">HỎI KHÁN GIẢ</button>
            </div>
        </div>

        <div class="question-box">
            <div class="combo-badge" id="combo-badge">COMBO X3 🔥</div>
            <div class="question-text" id="q-text">Loading...</div>
            <div class="options-grid" id="options-area"></div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-main" id="btn-next-turn" style="display:none; background: #555; padding: 10px 20px; font-size: 1rem;" onclick="forceNextQuestion()">BỎ QUA / XEM ĐÁP ÁN</button>
        </div>
    </div>

    <div class="container end-screen" id="end-screen">
        <h1 class="title" style="font-size: 4rem;">🎉 KẾT QUẢ CHUNG CUỘC 🎉</h1>
        <div class="rank-board" id="rank-board"></div>
        
        <div class="video-container">
            <div class="video-box" style="border-color: var(--success);" id="box-top1">
                <h2 style="color:var(--success); margin:0;">🏆 THƯỞNG CHO TOP 1</h2>
                <div class="secret-box" onclick="revealVideo('top1')">❓ BẤM ĐỂ MỞ QUÀ</div>
            </div>
            <div class="video-box" style="border-color: var(--warning);" id="box-bot">
                <h2 style="color:var(--warning); margin:0;">💀 PHẠT ĐỘI BÉT BẢNG</h2>
                <div class="secret-box" onclick="revealVideo('bot')">❓ BẤM ĐỂ NHẬN PHẠT</div>
            </div>
        </div>
        <button class="btn-main" onclick="location.reload()" style="margin-top: 30px;">CHƠI LẠI</button>
    </div>

    <div id="steal-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent1); font-size: 2.5rem; margin-top: 0;">⚡ GIÀNH QUYỀN TRẢ LỜI</h2>
            <p style="font-size: 1.2rem; color: #ccc;">Chọn đội giơ tay nhanh nhất:</p>
            <div class="steal-grid" id="steal-options"></div>
            <button class="btn-main" style="background: #555; margin-top: 20px;" onclick="nobodySteals()">KHÔNG AI DÀNH QUYỀN</button>
        </div>
    </div>

    <div id="call-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent2);">📞 TỔ TƯ VẤN</h2>
            <div id="call-content" style="font-size: 1.5rem; font-weight: bold; padding: 20px; line-height: 1.5;"></div>
            <button class="btn-main" onclick="document.getElementById('call-modal').style.display='none'">ĐÃ RÕ!</button>
        </div>
    </div>

    <div id="gift-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: #ffdf00; font-size: 2.5rem; margin-top: 0;">🎁 CHỌN 1 HỘP QUÀ</h2>
            <div class="gift-container" id="gift-options-box">
                <div class="gift-icon" onclick="openGift()">📦</div>
                <div class="gift-icon" onclick="openGift()">📦</div>
                <div class="gift-icon" onclick="openGift()">📦</div>
            </div>
            <div id="gift-result" style="font-size: 2.5rem; display:none; margin: 30px 0; font-weight: bold; text-shadow: 2px 2px 5px black;"></div>
            <button class="btn-main" id="close-modal-btn" style="display:none;" onclick="closeGiftModal()">ĐI TIẾP THÔI</button>
        </div>
    </div>

    <script>
        const playSound = (id) => { document.getElementById(id).currentTime = 0; document.getElementById(id).play().catch(()=>{}); }
        const fireConfetti = () => { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 9999 }); }

        const dbQuestions = [
            { q: "Từ vựng nào chỉ 'Trí tuệ nhân tạo'?", options: ["Artificial Intelligence", "Virtual Reality", "Machine Learning", "Big Data"], correct: 0 },
            { q: "Đâu là thủ đô của Canada?", options: ["Toronto", "Vancouver", "Ottawa", "Montreal"], correct: 2 },
            { q: "Hành tinh lớn nhất hệ Mặt Trời là?", options: ["Sao Hỏa", "Sao Mộc", "Sao Thổ", "Sao Kim"], correct: 1 },
            { q: "Ai là người viết ra truyện Harry Potter?", options: ["J.R.R. Tolkien", "J.K. Rowling", "Stephen King", "George Martin"], correct: 1 },
            { q: "Trái nghĩa với 'Generous' (Hào phóng)?", options: ["Kind", "Mean", "Happy", "Sad"], correct: 1 },
            { q: "Cơ quan nào bơm máu đi khắp cơ thể?", options: ["Não", "Phổi", "Tim", "Dạ dày"], correct: 2 },
            { q: "Năm 2024 có bao nhiêu ngày?", options: ["364", "365", "366", "367"], correct: 2 }
        ];

        while(dbQuestions.length < 12) {
            dbQuestions.push({ q: `Câu hỏi phụ số ${dbQuestions.length + 1}`, options: ["A", "B", "C", "D"], correct: 0 });
        }

        let questions = [...dbQuestions].sort(() => Math.random() - 0.5);
        let teams = [];
        let mainTurnIdx = 0; 
        let currentAnsweringIdx = 0; 
        let attemptedThisTurn = []; 
        let timer, timeLeft = 20;

        // TẠO KHO QUÀ VÀ QUẢN LÝ QUÀ ĐÃ MỞ
        const masterGifts = [
            { t: "👑 JACKPOT! +50 ĐIỂM", f: () => teams[currentAnsweringIdx].score += 50, color: "#00ff66" },
            { t: "💰 NHẶT ĐƯỢC BÍ KÍP! +30 ĐIỂM", f: () => teams[currentAnsweringIdx].score += 30, color: "#00ff66" },
            { t: "🚀 ĐỘT PHÁ! NHÂN ĐÔI ĐIỂM (X2)", f: () => teams[currentAnsweringIdx].score *= 2, color: "#00f0ff" },
            { t: "🧛‍♂️ MA CÀ RỒNG! HÚT 15 ĐIỂM MỖI ĐỘI", f: () => teams.forEach((t, i) => { if(i !== currentAnsweringIdx) { t.score = Math.max(0, t.score - 15); teams[currentAnsweringIdx].score += 15; } }), color: "#ff007b" },
            { t: "💀 BƯỚC HỤT! TRỪ 20 ĐIỂM", f: () => teams[currentAnsweringIdx].score = Math.max(0, teams[currentAnsweringIdx].score - 20), color: "#ff3300" },
            { t: "✂️ ĐỨT GÁNH! CHIA ĐÔI ĐIỂM", f: () => teams[currentAnsweringIdx].score = Math.floor(teams[currentAnsweringIdx].score / 2), color: "#ff3300" },
            { t: "👼 PHẬT ONLINE: TẶNG MỌI NGƯỜI 10 ĐIỂM", f: () => teams.forEach((t, i) => { if(i !== currentAnsweringIdx) t.score += 10; }), color: "#ffdf00" },
            { t: "🔄 HOÁN ĐỔI! ĐỔI ĐIỂM VỚI ĐỘI BÉT", f: swapWithLast, color: "#ff00ff" },
            { t: "🌪️ BÃO TÁP! TRỪ TẤT CẢ 20 ĐIỂM", f: () => teams.forEach(t => t.score = Math.max(0, t.score - 20)), color: "#ff3300" },
            { t: "🛡️ KHIÊN ĐỒNG: CỘNG AN ỦI 10 ĐIỂM", f: () => teams[currentAnsweringIdx].score += 10, color: "#00f0ff" }
        ];
        let availableGifts = [...masterGifts];

        function startGame() {
            for(let i=0; i<4; i++) {
                teams.push({
                    name: document.getElementById('t'+i).value || `Nhóm ${i+1}`,
                    score: 0, streak: 0, qPlayed: 0, l5050: false, lCall: false, lAudience: false
                });
            }
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            loadMainTurn();
        }

        function loadMainTurn() {
            // Giới hạn 3 câu hỏi cho dễ test
            if (teams[mainTurnIdx].qPlayed >= 3) {
                mainTurnIdx++;
                if (mainTurnIdx >= 4) return endGame();
            }
            if (questions.length === 0) return endGame();

            currentAnsweringIdx = mainTurnIdx;
            attemptedThisTurn = [];
            teams[mainTurnIdx].qPlayed++;

            document.getElementById('main-turn-name').innerText = teams[mainTurnIdx].name;
            document.getElementById('display-team-name').innerText = teams[mainTurnIdx].name;
            document.getElementById('q-count').innerText = teams[mainTurnIdx].qPlayed;
            document.getElementById('steal-badge').style.display = 'none';
            document.getElementById('btn-next-turn').style.display = 'none';
            
            updateScoreDisplay();
            updateLifelinesUI();
            loadQuestionUI();
        }

        function updateScoreDisplay() {
            document.getElementById('display-team-score').innerText = teams[currentAnsweringIdx].score;
            const badge = document.getElementById('combo-badge');
            let streak = teams[currentAnsweringIdx].streak;
            if (streak >= 2) {
                badge.style.display = 'block';
                badge.innerText = `COMBO X${streak} 🔥`;
            } else badge.style.display = 'none';
        }

        function updateLifelinesUI() {
            const container = document.getElementById('lifelines-container');
            if (currentAnsweringIdx !== mainTurnIdx) return container.style.visibility = 'hidden';
            container.style.visibility = 'visible';
            const t = teams[mainTurnIdx];
            ['5050', 'call', 'audience'].forEach(l => {
                const btn = document.getElementById(`ll-${l}`);
                const isUsed = l === '5050' ? t.l5050 : (l === 'call' ? t.lCall : t.lAudience);
                btn.className = `btn-lifeline ${isUsed ? 'used' : ''}`;
                btn.disabled = isUsed;
            });
        }

        function loadQuestionUI() {
            const qData = questions[0]; 
            document.getElementById('q-text').innerText = qData.q;
            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.id = 'opt-' + idx;
                btn.innerHTML = `<span style="color:var(--accent2); font-weight:900;">${letters[idx]}.</span> ${opt}`;
                btn.onclick = () => checkAnswer(idx);
                optionsArea.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 20;
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = `⏳ ${timeLeft}`;
            timerEl.classList.remove('warning');
            timer = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `⏳ ${timeLeft}`;
                if (timeLeft <= 5 && timeLeft > 0) timerEl.classList.add('warning');
                if (timeLeft <= 0) { clearInterval(timer); handleWrongAnswer(null); }
            }, 1000);
        }

        function checkAnswer(selectedIdx) {
            clearInterval(timer);
            document.getElementById('timer-display').classList.remove('warning');
            const qData = questions[0];
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            document.getElementById('lifelines-container').style.visibility = 'hidden';

            if (selectedIdx === qData.correct) {
                playSound('sfx-correct');
                fireConfetti();
                document.getElementById('opt-' + selectedIdx).classList.add('correct');
                teams[currentAnsweringIdx].score += 10;
                teams[currentAnsweringIdx].streak++;
                updateScoreDisplay();

                if (teams[currentAnsweringIdx].streak > 0 && teams[currentAnsweringIdx].streak % 3 === 0) {
                    setTimeout(showGiftModal, 1500);
                } else {
                    setTimeout(forceNextQuestion, 2500); 
                }
            } else {
                playSound('sfx-wrong');
                handleWrongAnswer(selectedIdx);
            }
        }

        function handleWrongAnswer(selectedIdx) {
            if (selectedIdx !== null) document.getElementById('opt-' + selectedIdx).classList.add('wrong');
            teams[currentAnsweringIdx].streak = 0;
            attemptedThisTurn.push(currentAnsweringIdx);
            updateScoreDisplay();
            document.querySelectorAll('.option-btn').forEach((b) => {
                if (!b.classList.contains('wrong') && !b.classList.contains('disabled-5050')) b.disabled = false;
            });
            if (attemptedThisTurn.length >= 4) setTimeout(forceNextQuestion, 1500);
            else setTimeout(showStealModal, 1000);
        }

        function showStealModal() {
            const modal = document.getElementById('steal-modal');
            const grid = document.getElementById('steal-options');
            grid.innerHTML = '';
            teams.forEach((t, i) => {
                if (!attemptedThisTurn.includes(i)) {
                    const btn = document.createElement('button');
                    btn.className = 'steal-btn';
                    btn.innerText = t.name;
                    btn.onclick = () => stealTurn(i);
                    grid.appendChild(btn);
                }
            });
            modal.style.display = 'flex';
        }

        function stealTurn(teamIdx) {
            document.getElementById('steal-modal').style.display = 'none';
            currentAnsweringIdx = teamIdx;
            document.getElementById('display-team-name').innerText = teams[currentAnsweringIdx].name;
            document.getElementById('steal-badge').style.display = 'inline-block';
            updateScoreDisplay();
            document.getElementById('btn-next-turn').style.display = 'inline-block';
            startTimer(); 
        }

        function nobodySteals() {
            document.getElementById('steal-modal').style.display = 'none';
            forceNextQuestion();
        }

        function forceNextQuestion() {
            clearInterval(timer);
            document.getElementById('timer-display').classList.remove('warning');
            const correctIdx = questions[0].correct;
            const correctBtn = document.getElementById('opt-' + correctIdx);
            if(correctBtn) correctBtn.classList.add('correct');
            
            setTimeout(() => { 
                questions.shift(); 
                loadMainTurn(); 
            }, 2000);
        }

        function use5050() {
            teams[mainTurnIdx].l5050 = true; updateLifelinesUI();
            let wrongIndices = [];
            const correctIdx = questions[0].correct;
            for(let i=0; i<4; i++) { if(i !== correctIdx) wrongIndices.push(i); }
            wrongIndices.sort(() => Math.random() - 0.5);
            wrongIndices.slice(0, 2).forEach(idx => {
                const btn = document.getElementById('opt-' + idx);
                btn.classList.add('disabled-5050'); btn.disabled = true;
            });
        }

        function useCall() {
            teams[mainTurnIdx].lCall = true; updateLifelinesUI();
            const ans = ['A', 'B', 'C', 'D'][questions[0].correct];
            const quotes = [
                `🎤 Đàm Vĩnh Hưng: "Vùng đất cấm thì anh rành, chứ câu này anh nhắm mắt chọn đáp án <b>${ans}</b> nha bé!"`,
                `🔥 MCK: "Flow này hơi gắt nhưng chốt đơn đáp án <b>${ans}</b> cho anh, uy tín luôn!"`
            ];
            document.getElementById('call-content').innerHTML = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('call-modal').style.display = 'flex';
        }

        function useAudience() {
            teams[mainTurnIdx].lAudience = true; updateLifelinesUI();
            const correctIdx = questions[0].correct;
            const letters = ['A', 'B', 'C', 'D'];
            let html = `Tổ tư vấn lớp học đã vote xong:<br><br>`;
            letters.forEach((l, idx) => {
                let percent = (idx === correctIdx) ? Math.floor(Math.random() * 20 + 60) : Math.floor(Math.random() * 10);
                if (idx === 3) percent = 100 - (letters.reduce((acc, curr, i) => acc + (i === correctIdx ? percent : (i < 3 ? Math.floor(Math.random() * 10) : 0)), 0)); 
                html += `Đáp án ${l}: <b style="color:var(--accent2);">${idx === correctIdx ? '68' : Math.abs(percent)}%</b><br>`;
            });
            document.getElementById('call-content').innerHTML = html;
            document.getElementById('call-modal').style.display = 'flex';
        }

        function showGiftModal() {
            playSound('sfx-tada');
            document.getElementById('gift-modal').style.display = 'flex';
            document.getElementById('gift-options-box').style.display = 'flex';
            document.getElementById('gift-result').style.display = 'none';
            document.getElementById('close-modal-btn').style.display = 'none';
        }

        function openGift() {
            if (availableGifts.length === 0) availableGifts = [...masterGifts]; // Reset nếu lụm hết sạch kho
            
            // Xóa món quà vừa bốc khỏi mảng
            const randIdx = Math.floor(Math.random() * availableGifts.length);
            const g = availableGifts[randIdx];
            availableGifts.splice(randIdx, 1);
            
            g.f();
            document.getElementById('gift-options-box').style.display = 'none';
            const resEl = document.getElementById('gift-result');
            resEl.innerText = g.t;
            resEl.style.color = g.color;
            resEl.style.display = 'block';
            document.getElementById('close-modal-btn').style.display = 'inline-block';
            updateScoreDisplay();
        }

        function swapWithLast() {
            let lastIdx = 0;
            teams.forEach((t, i) => { if(t.score < teams[lastIdx].score) lastIdx = i; });
            if(lastIdx !== currentAnsweringIdx) {
                let temp = teams[currentAnsweringIdx].score;
                teams[currentAnsweringIdx].score = teams[lastIdx].score;
                teams[lastIdx].score = temp;
            }
        }

        function closeGiftModal() {
            document.getElementById('gift-modal').style.display = 'none';
            forceNextQuestion(); 
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            fireConfetti();
            setInterval(fireConfetti, 3000); 
            
            let sorted = [...teams].sort((a, b) => b.score - a.score);
            let html = '';
            sorted.forEach((t, i) => {
                html += `<div class="rank-card">HẠNG ${i+1}<br><span style="color:var(--accent2); font-size:1.8rem;">${t.name}</span><br><span style="color:#00ff66; font-size:2rem;">${t.score}</span> điểm</div>`;
            });
            document.getElementById('rank-board').innerHTML = html;
        }

        // PHÁT FILE VIDEO ĐỂ TRONG CÙNG THƯ MỤC VÀ TỰ ĐỘNG BUNG FULL MÀN HÌNH
        function revealVideo(type) {
            const container = document.getElementById('box-' + type);
            // THAY TÊN FILE VIDEO CỦA BẠN VÀO ĐÂY (VÍ DỤ: video-thuong.mp4)
            let videoFile = type === 'top1' ? './thuong.mp4' : './phat.mp4';
            let titleHTML = type === 'top1' 
                ? `<h2 style="color:var(--success); margin:0; margin-bottom: 15px;">🏆 THƯỞNG CHO TOP 1</h2>` 
                : `<h2 style="color:var(--warning); margin:0; margin-bottom: 15px;">💀 PHẠT ĐỘI BÉT BẢNG</h2>`;

            container.innerHTML = `
                ${titleHTML}
                <video id="vid-${type}" src="${videoFile}" controls autoplay style="width: 100%; border-radius: 15px; margin-top: 10px;"></video>
            `;

            const vidElement = document.getElementById(`vid-${type}`);
            
            // Xử lý Fullscreen
            if (vidElement.requestFullscreen) {
                vidElement.requestFullscreen();
            } else if (vidElement.webkitRequestFullscreen) { /* Safari */
                vidElement.webkitRequestFullscreen();
            } else if (vidElement.msRequestFullscreen) { /* IE11 */
                vidElement.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
