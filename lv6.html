<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD BOOM - MYSTERY BOARD</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ffffff;
            --accent1: #ff007b;
            --accent2: #00f0ff;
            --warning: #ff3300;
            --success: #00ff66;
            --panel-bg: rgba(20, 20, 40, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #0d001a, #240046, #001133);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        body.time-warning { box-shadow: inset 0 0 80px 20px rgba(255, 0, 0, 0.8); }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .container {
            width: 95%; max-width: 1200px;
            background: var(--panel-bg); border-radius: 25px; padding: 30px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
            border: 2px solid rgba(0,240,255,0.3);
            position: relative; z-index: 10;
        }

        h1.title {
            text-align: center; font-size: 3rem; margin-bottom: 20px;
            background: linear-gradient(90deg, #ff007b, #00f0ff, #ffdf00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.5)); letter-spacing: 2px;
        }

        button { transition: all 0.3s ease; cursor: pointer; }
        button:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Setup Screen */
        .setup-screen { text-align: center; }
        .setup-screen input {
            padding: 15px; margin: 15px; border-radius: 12px;
            border: 2px solid var(--accent2); background: rgba(0,0,0,0.5);
            color: white; text-align: center; font-size: 1.2rem; outline: none;
        }

        .btn-main {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 50px;
            background: linear-gradient(45deg, #ff007b, #ff7a00); color: white;
            box-shadow: 0 10px 20px rgba(255,0,123,0.5); margin-top: 20px; text-transform: uppercase;
        }

        /* LIVE SCOREBOARD */
        .scoreboard-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px dashed rgba(255,255,255,0.2);
        }
        .score-card {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--accent2);
            border-radius: 15px; padding: 15px; text-align: center;
            transition: 0.3s;
        }
        .score-card.active {
            border-color: var(--success); box-shadow: 0 0 20px rgba(0,255,102,0.4);
            transform: scale(1.05); background: rgba(0, 255, 102, 0.1);
        }
        .score-team-name { font-size: 1.2rem; font-weight: bold; color: #ffdf00; margin-bottom: 5px; text-transform: uppercase; }
        .score-points { font-size: 2.5rem; font-weight: 900; color: white; text-shadow: 2px 2px 4px black; }

        .steal-badge { display: inline-block; background: #ffdf00; color: black; font-size: 1rem; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Lifelines & Timer */
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .timer { font-size: 2.5rem; font-weight: bold; color: white; background: rgba(0,0,0,0.5); padding: 5px 30px; border-radius: 20px; border: 2px solid var(--accent2); }
        .timer.warning { color: white; background: var(--warning); border-color: var(--warning); animation: pulse 0.5s infinite; box-shadow: 0 0 20px var(--warning); }

        .lifelines { display: flex; gap: 10px; visibility: hidden; }
        .btn-lifeline { background: linear-gradient(45deg, #8e2de2, #4a00e0); color: white; border: 2px solid #fff; padding: 10px 20px; border-radius: 15px; font-weight: bold; font-size: 1rem; }
        .btn-lifeline.used { background: #555; color: #888; border-color: #444; text-decoration: line-through; }

        /* GRID (28 Boxes) */
        .grid-area { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-top: 10px; }
        .grid-box {
            background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(255,0,123,0.2));
            border: 2px dashed var(--accent2); border-radius: 15px; padding: 25px 10px;
            font-size: 2rem; font-weight: bold; color: #fff; text-align: center;
            cursor: pointer; transition: 0.3s; text-shadow: 0 0 10px var(--accent2);
        }
        .grid-box:hover { background: rgba(0,240,255,0.5); border-style: solid; box-shadow: 0 0 15px var(--accent2); transform: scale(1.05); }
        .grid-box.opened { opacity: 0; pointer-events: none; transform: scale(0.5); }

        /* Question Area */
        .question-area { display: none; background: linear-gradient(135deg, rgba(255,0,123,0.3), rgba(0,240,255,0.3)); padding: 40px; border-radius: 20px; text-align: center; border: 2px solid rgba(255,255,255,0.4); position: relative; }
        .question-text { font-size: 2rem; margin-bottom: 40px; font-weight: bold; text-shadow: 1px 1px 3px black; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: rgba(0,0,0,0.6); border: 2px solid var(--accent2); color: white; padding: 20px; font-size: 1.3rem; 
            border-radius: 15px; text-align: left; padding-left: 20px; font-weight: 600;
        }
        .option-btn:hover:not(:disabled) { border-color: #fff; background: rgba(0,240,255,0.4); box-shadow: 0 0 20px rgba(0,240,255,0.6); }
        .option-btn.correct { background: var(--success); color: black; border-color: white; transform: scale(1.05); box-shadow: 0 0 30px var(--success); }
        .option-btn.wrong { background: var(--warning); color: white; border-color: white; opacity: 0.6; }
        .option-btn.disabled-5050 { opacity: 0.2; pointer-events: none; }
        .combo-badge { position: absolute; top: -20px; right: 20px; background: #ffdf00; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1rem; box-shadow: 0 0 15px #ffdf00; display: none; z-index: 10; }

        /* Event Area */
        .event-area { display: none; background: rgba(0,0,0,0.8); padding: 50px; border-radius: 20px; text-align: center; border: 3px solid var(--accent1); box-shadow: 0 0 30px rgba(255,0,123,0.5); }
        .event-title { font-size: 2.5rem; margin-bottom: 20px; color: #ffdf00; text-transform: uppercase; }
        .event-text { font-size: 1.8rem; color: white; margin-bottom: 40px; line-height: 1.5; }
        
        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: linear-gradient(135deg, #1f0033, #001a33); border: 3px solid var(--accent2); border-radius: 25px; padding: 50px; text-align: center; width: 80%; max-width: 600px; box-shadow: 0 0 50px rgba(0,240,255,0.3); }
        .team-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .team-btn { background: #ff007b; border: 2px solid white; color: white; padding: 15px; font-size: 1.5rem; border-radius: 15px; font-weight: bold; }

        .gift-container { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .gift-icon { font-size: 100px; cursor: pointer; transition: 0.3s; animation: float 2s infinite ease-in-out; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        .gift-icon:hover { transform: scale(1.2); filter: drop-shadow(0 0 20px #ffdf00); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* END GAME */
        .end-screen { display: none; text-align: center; width: 100%; }
        .rank-tier { display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--accent2); text-align: left; }
        .rank-pos { font-size: 3rem; font-weight: 900; margin-right: 20px; min-width: 80px; text-align: center; }
        .rank-details { flex-grow: 1; }
        .rank-name { font-size: 2rem; font-weight: bold; color: #ffdf00; }
        .rank-score { font-size: 1.5rem; color: #00ff66; margin-bottom: 5px; }
        .rank-action { font-size: 1.2rem; color: white; font-style: italic; }
        
        .secret-btn { background: #ff007b; color: white; border: 2px solid white; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; display: inline-block; }
        .secret-btn:hover { background: white; color: #ff007b; }

        .tier-1 { border-color: #ffdf00; box-shadow: 0 0 20px rgba(255,223,0,0.5); }
        .tier-1 .rank-pos { color: #ffdf00; }
        .tier-2 { border-color: #c0c0c0; }
        .tier-2 .rank-pos { color: #c0c0c0; }
        .tier-3 { border-color: #cd7f32; }
        .tier-3 .rank-pos { color: #cd7f32; }
        .tier-4 { border-color: #ff3300; }
        .tier-4 .rank-pos { color: #ff3300; }
    </style>
</head>
<body>
    <audio id="sfx-correct" src="https://www.myinstants.com/media/sounds/correct.mp3"></audio>
    <audio id="sfx-wrong" src="https://www.myinstants.com/media/sounds/wrong-buzzer.mp3"></audio>
    <audio id="sfx-tada" src="https://www.myinstants.com/media/sounds/tada.mp3"></audio>

    <div class="container" id="setup-screen">
        <h1 class="title">WORD BOOM: MYSTERY BOARD</h1>
        <div class="setup-screen">
            <input type="text" id="t0" value="TEAM ALPHA">
            <input type="text" id="t1" value="TEAM BETA"><br>
            <input type="text" id="t2" value="TEAM GAMMA">
            <input type="text" id="t3" value="TEAM DELTA"><br>
            <button class="btn-main" onclick="startGame()">START BATTLE</button>
        </div>
    </div>

    <div class="container" id="game-screen" style="display: none;">
        <div class="scoreboard-bar" id="scoreboard-bar"></div>

        <div style="text-align: center; height: 35px;">
            <div class="steal-badge" id="steal-badge">⚡ STEALING TURN ⚡</div>
        </div>

        <div class="status-bar">
            <div class="timer" id="timer-display" style="visibility: hidden;">⏳ 20</div>
            <div class="lifelines" id="lifelines-container">
                <button class="btn-lifeline" id="ll-5050" onclick="use5050()">50/50</button>
                <button class="btn-lifeline" id="ll-call" onclick="useCall()">PHONE A FRIEND</button>
                <button class="btn-lifeline" id="ll-audience" onclick="useAudience()">ASK AUDIENCE</button>
            </div>
        </div>

        <div class="grid-area" id="grid-area"></div>

        <div class="question-area" id="question-area">
            <div class="combo-badge" id="combo-badge">COMBO X3 🔥</div>
            <div class="question-text" id="q-text">Loading...</div>
            <div class="options-grid" id="options-area"></div>
        </div>
        
        <div class="event-area" id="event-area">
            <div class="event-title" id="event-title">EVENT</div>
            <div class="event-text" id="event-text">...</div>
            <button class="btn-main" onclick="acceptEvent()">DONE</button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-main" id="btn-next-turn" style="display:none; background: #555; padding: 10px 20px; font-size: 1rem;" onclick="processTurnEnd()">SKIP / CONTINUE</button>
        </div>
    </div>

    <div class="container end-screen" id="end-screen">
        <h1 class="title" style="font-size: 3.5rem;">🎉 FINAL RESULTS 🎉</h1>
        <div id="rank-board"></div>
        <button class="btn-main" onclick="location.reload()" style="margin-top: 30px;">PLAY AGAIN</button>
    </div>

    <div id="team-select-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent2); font-size: 2.5rem; margin-top: 0;">🎯 SELECT A TEAM</h2>
            <p style="font-size: 1.2rem; color: #ccc;">Who will open this box?</p>
            <div class="team-select-grid" id="initial-team-options"></div>
            <button class="btn-main" style="background: #555; margin-top: 20px;" onclick="cancelBoxOpen()">CANCEL</button>
        </div>
    </div>

    <div id="steal-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent1); font-size: 2.5rem; margin-top: 0;">⚡ STEAL THE TURN</h2>
            <p style="font-size: 1.2rem; color: #ccc;">Select the fastest team to raise their hand:</p>
            <div class="team-select-grid" id="steal-options"></div>
            <button class="btn-main" style="background: #555; margin-top: 20px;" onclick="nobodySteals()">NO ONE STEALS</button>
        </div>
    </div>

    <div id="call-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent2);">📞 LIFELINE</h2>
            <div id="call-content" style="font-size: 1.5rem; font-weight: bold; padding: 20px; line-height: 1.5;"></div>
            <button class="btn-main" onclick="document.getElementById('call-modal').style.display='none'">GOT IT!</button>
        </div>
    </div>

    <div id="gift-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: #ffdf00; font-size: 2.5rem; margin-top: 0;">🎁 COMBO REWARD</h2>
            <p style="color:white; font-size: 1.2rem;">Pick a mystery box:</p>
            <div class="gift-container" id="gift-options-box">
                <div class="gift-icon" onclick="openComboGift()">📦</div>
                <div class="gift-icon" onclick="openComboGift()">📦</div>
                <div class="gift-icon" onclick="openComboGift()">📦</div>
            </div>
            <div id="gift-result" style="font-size: 2.5rem; display:none; margin: 30px 0; font-weight: bold; text-shadow: 2px 2px 5px black;"></div>
            <button class="btn-main" id="close-modal-btn" style="display:none;" onclick="closeGiftModal()">CONTINUE</button>
        </div>
    </div>

    <script>
        const playSound = (id) => { document.getElementById(id).currentTime = 0; document.getElementById(id).play().catch(()=>{}); }
        const fireConfetti = () => { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 9999 }); }

        // 20 Questions
        const qList = [
            { q: "What is the synonym of 'Happy'?", options: ["Sad", "Joyful", "Angry", "Tired"], correct: 1 },
            { q: "Which animal is known as the King of the Jungle?", options: ["Tiger", "Lion", "Elephant", "Bear"], correct: 1 },
            { q: "What is the past tense of 'Go'?", options: ["Goed", "Going", "Went", "Gone"], correct: 2 },
            { q: "How many days are in a leap year?", options: ["364", "365", "366", "367"], correct: 2 },
            { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { q: "What is the opposite of 'Difficult'?", options: ["Hard", "Complex", "Easy", "Tough"], correct: 2 },
            { q: "Who wrote 'Romeo and Juliet'?", options: ["Charles Dickens", "William Shakespeare", "Mark Twain", "J.K. Rowling"], correct: 1 },
            { q: "Which is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { q: "What do bees make?", options: ["Milk", "Honey", "Silk", "Webs"], correct: 1 },
            { q: "How many legs does a spider have?", options: ["6", "8", "10", "12"], correct: 1 },
            { q: "What is the capital of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], correct: 2 },
            { q: "Which word is a noun?", options: ["Run", "Beautiful", "Quickly", "Table"], correct: 3 },
            { q: "What is freezing point of water?", options: ["0°C", "10°C", "50°C", "100°C"], correct: 0 },
            { q: "Find the odd one out:", options: ["Apple", "Banana", "Carrot", "Mango"], correct: 2 },
            { q: "What is the fastest land animal?", options: ["Lion", "Cheetah", "Horse", "Leopard"], correct: 1 },
            { q: "Which month has the shortest number of days?", options: ["January", "February", "March", "April"], correct: 1 },
            { q: "What colors make green?", options: ["Red & Blue", "Blue & Yellow", "Red & Yellow", "Black & White"], correct: 1 },
            { q: "What is 15 multiplied by 3?", options: ["35", "40", "45", "50"], correct: 2 },
            { q: "Where is the Eiffel Tower located?", options: ["London", "Berlin", "Rome", "Paris"], correct: 3 },
            { q: "Which gas do humans breathe in to survive?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Helium"], correct: 0 }
        ];

        // 8 Events/Challenges
        const eventList = [
            { type: 'points', val: 30, title: "LUCKY DROP", text: "A bag of gold fell on your head! +30 Points." },
            { type: 'points', val: 50, title: "JACKPOT", text: "You found the hidden treasure! +50 Points." },
            { type: 'points', val: -20, title: "STEPPED ON A MINE", text: "BOOM! You lost 20 Points." },
            { type: 'points', val: -10, title: "PICKPOCKETED", text: "A thief stole 10 Points from you." },
            { type: 'swap', val: 0, title: "FREAKY FRIDAY", text: "You must swap your score with the highest team!" },
            { type: 'challenge', val: 0, title: "CHALLENGE: DANCER", text: "Your team must do a Tiktok dance for 15 seconds!" },
            { type: 'challenge', val: 0, title: "CHALLENGE: SINGER", text: "Sing the chorus of an English song loudly!" },
            { type: 'challenge', val: 0, title: "CHALLENGE: FITNESS", text: "The team captain must do 10 push-ups or 15 jumping jacks!" }
        ];

        let masterBoxes = [];
        qList.forEach(q => masterBoxes.push({ type: 'question', ...q }));
        eventList.forEach(e => masterBoxes.push(e));

        let activeBoxes = [...masterBoxes].sort(() => Math.random() - 0.5);
        activeBoxes.forEach(b => b.opened = false);

        let teams = [];
        let openedBoxesCount = 0; 
        let mainTurnIdx = 0; 
        let currentAnsweringIdx = 0; 
        let attemptedThisTurn = []; 
        let currentActiveBox = null;
        let pendingBoxIdx = null;
        let timer, timeLeft = 20;

        const comboGifts = [
            { t: "JACKPOT! +40 POINTS", f: () => teams[currentAnsweringIdx].score += 40, color: "#00ff66" },
            { t: "DOUBLE POINTS (X2)", f: () => teams[currentAnsweringIdx].score *= 2, color: "#00f0ff" },
            { t: "VAMPIRE! STEAL 10 FROM ALL", f: () => teams.forEach((t, i) => { if(i !== currentAnsweringIdx) { t.score -= 10; teams[currentAnsweringIdx].score += 10; } }), color: "#ff007b" },
            { t: "TRAP! LOSE 20 POINTS", f: () => teams[currentAnsweringIdx].score -= 20, color: "#ff3300" }
        ];
        let availableComboGifts = [...comboGifts];

        function startGame() {
            for(let i=0; i<4; i++) {
                teams.push({
                    name: document.getElementById('t'+i).value || `TEAM ${i+1}`,
                    score: 0, streak: 0, l5050: false, lCall: false, lAudience: false
                });
            }
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateScoreboard();
            showGridScreen();
        }

        // UPDATE LIVE SCOREBOARD
        function updateScoreboard() {
            const sb = document.getElementById('scoreboard-bar');
            sb.innerHTML = '';
            teams.forEach((t, i) => {
                const isActive = (document.getElementById('question-area').style.display === 'block' || document.getElementById('event-area').style.display === 'block') && i === currentAnsweringIdx;
                sb.innerHTML += `
                    <div class="score-card ${isActive ? 'active' : ''}">
                        <div class="score-team-name">${t.name}</div>
                        <div class="score-points">${t.score}</div>
                    </div>
                `;
            });
        }

        function showGridScreen() {
            if (openedBoxesCount >= 28) return endGame();

            attemptedThisTurn = [];
            currentActiveBox = null;
            document.body.classList.remove('time-warning');

            document.getElementById('grid-area').style.display = 'grid';
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('event-area').style.display = 'none';
            document.getElementById('lifelines-container').style.visibility = 'hidden';
            document.getElementById('timer-display').style.visibility = 'hidden';
            document.getElementById('steal-badge').style.display = 'none';
            document.getElementById('btn-next-turn').style.display = 'none';
            
            updateScoreboard(); // Reset active highlight

            const gridArea = document.getElementById('grid-area');
            gridArea.innerHTML = '';
            activeBoxes.forEach((box, idx) => {
                const btn = document.createElement('div');
                btn.className = `grid-box ${box.opened ? 'opened' : ''}`;
                btn.innerText = idx + 1;
                if(!box.opened) btn.onclick = () => showTeamSelectModal(idx);
                gridArea.appendChild(btn);
            });
        }

        // SELECT TEAM MANUALLY
        function showTeamSelectModal(idx) {
            pendingBoxIdx = idx;
            const modal = document.getElementById('team-select-modal');
            const grid = document.getElementById('initial-team-options');
            grid.innerHTML = '';
            teams.forEach((t, i) => {
                const btn = document.createElement('button');
                btn.className = 'team-btn';
                btn.innerText = t.name;
                btn.onclick = () => startBoxForTeam(i);
                grid.appendChild(btn);
            });
            modal.style.display = 'flex';
        }

        function cancelBoxOpen() {
            document.getElementById('team-select-modal').style.display = 'none';
            pendingBoxIdx = null;
        }

        function startBoxForTeam(teamIdx) {
            document.getElementById('team-select-modal').style.display = 'none';
            mainTurnIdx = teamIdx;
            currentAnsweringIdx = teamIdx;
            
            playSound('sfx-tada');
            activeBoxes[pendingBoxIdx].opened = true;
            currentActiveBox = activeBoxes[pendingBoxIdx];
            document.getElementById('grid-area').style.display = 'none';
            updateScoreboard(); // Highlights the answering team

            if (currentActiveBox.type === 'question') {
                loadQuestionUI(currentActiveBox);
            } else {
                loadEventUI(currentActiveBox);
            }
        }

        function loadEventUI(box) {
            document.getElementById('event-area').style.display = 'block';
            document.getElementById('event-title').innerText = box.title;
            document.getElementById('event-title').style.color = (box.val > 0 || box.type === 'challenge') ? '#ffdf00' : '#ff3300';
            document.getElementById('event-text').innerText = box.text;
        }

        function acceptEvent() {
            if(currentActiveBox.type === 'points') {
                teams[currentAnsweringIdx].score += currentActiveBox.val;
                if(currentActiveBox.val > 0) playSound('sfx-correct'); else playSound('sfx-wrong');
            } else if (currentActiveBox.type === 'swap') {
                let maxIdx = 0;
                teams.forEach((t, i) => { if(t.score > teams[maxIdx].score) maxIdx = i; });
                if(maxIdx !== currentAnsweringIdx) {
                    let temp = teams[currentAnsweringIdx].score;
                    teams[currentAnsweringIdx].score = teams[maxIdx].score;
                    teams[maxIdx].score = temp;
                }
                playSound('sfx-tada');
            } else {
                playSound('sfx-correct');
            }
            updateScoreboard();
            setTimeout(processTurnEnd, 1000);
        }

        function loadQuestionUI(qData) {
            document.getElementById('question-area').style.display = 'block';
            updateLifelinesUI();
            
            document.getElementById('q-text').innerText = qData.q;
            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.id = 'opt-' + idx;
                btn.innerHTML = `<span style="color:var(--accent2); font-weight:900;">${letters[idx]}.</span> ${opt}`;
                btn.onclick = () => checkAnswer(idx);
                optionsArea.appendChild(btn);
            });
            startTimer();
            updateComboBadge();
        }

        function updateComboBadge() {
            const badge = document.getElementById('combo-badge');
            let streak = teams[currentAnsweringIdx].streak;
            if (streak >= 2 && currentActiveBox && currentActiveBox.type === 'question') {
                badge.style.display = 'block'; badge.innerText = `COMBO X${streak} 🔥`;
            } else badge.style.display = 'none';
        }

        function updateLifelinesUI() {
            const container = document.getElementById('lifelines-container');
            if (currentAnsweringIdx !== mainTurnIdx) return container.style.visibility = 'hidden';
            container.style.visibility = 'visible';
            const t = teams[mainTurnIdx];
            ['5050', 'call', 'audience'].forEach(l => {
                const btn = document.getElementById(`ll-${l}`);
                const isUsed = l === '5050' ? t.l5050 : (l === 'call' ? t.lCall : t.lAudience);
                btn.className = `btn-lifeline ${isUsed ? 'used' : ''}`;
                btn.disabled = isUsed;
            });
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 20;
            const timerEl = document.getElementById('timer-display');
            timerEl.style.visibility = 'visible';
            timerEl.innerText = `⏳ ${timeLeft}`;
            timerEl.classList.remove('warning');
            document.body.classList.remove('time-warning');

            timer = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `⏳ ${timeLeft}`;
                
                if (timeLeft <= 5 && timeLeft > 0) {
                    timerEl.classList.add('warning');
                    document.body.classList.add('time-warning');
                }

                if (timeLeft <= 0) { 
                    clearInterval(timer); 
                    document.body.classList.remove('time-warning');
                    handleWrongAnswer(null); 
                }
            }, 1000);
        }

        function checkAnswer(selectedIdx) {
            clearInterval(timer);
            document.getElementById('timer-display').classList.remove('warning');
            document.body.classList.remove('time-warning');

            const qData = currentActiveBox;
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            document.getElementById('lifelines-container').style.visibility = 'hidden';

            if (selectedIdx === qData.correct) {
                playSound('sfx-correct'); fireConfetti();
                document.getElementById('opt-' + selectedIdx).classList.add('correct');
                teams[currentAnsweringIdx].score += 10;
                teams[currentAnsweringIdx].streak++;
                updateScoreboard();
                updateComboBadge();

                if (teams[currentAnsweringIdx].streak > 0 && teams[currentAnsweringIdx].streak % 3 === 0) {
                    setTimeout(showGiftModal, 1500);
                } else {
                    setTimeout(processTurnEnd, 2500); 
                }
            } else {
                playSound('sfx-wrong');
                handleWrongAnswer(selectedIdx);
            }
        }

        function handleWrongAnswer(selectedIdx) {
            if (selectedIdx !== null) document.getElementById('opt-' + selectedIdx).classList.add('wrong');
            teams[currentAnsweringIdx].streak = 0;
            attemptedThisTurn.push(currentAnsweringIdx);
            updateScoreboard();
            updateComboBadge();
            
            document.querySelectorAll('.option-btn').forEach((b) => {
                if (!b.classList.contains('wrong') && !b.classList.contains('disabled-5050')) b.disabled = false;
            });
            if (attemptedThisTurn.length >= 4) {
                const correctBtn = document.getElementById('opt-' + currentActiveBox.correct);
                if(correctBtn) correctBtn.classList.add('correct');
                setTimeout(processTurnEnd, 2000);
            } else {
                setTimeout(showStealModal, 1000);
            }
        }

        function showStealModal() {
            const modal = document.getElementById('steal-modal');
            const grid = document.getElementById('steal-options');
            grid.innerHTML = '';
            teams.forEach((t, i) => {
                if (!attemptedThisTurn.includes(i)) {
                    const btn = document.createElement('button');
                    btn.className = 'team-btn';
                    btn.innerText = t.name;
                    btn.onclick = () => stealTurn(i);
                    grid.appendChild(btn);
                }
            });
            modal.style.display = 'flex';
        }

        function stealTurn(teamIdx) {
            document.getElementById('steal-modal').style.display = 'none';
            currentAnsweringIdx = teamIdx;
            
            document.getElementById('steal-badge').style.display = 'inline-block';
            updateScoreboard();
            updateComboBadge();
            
            document.getElementById('btn-next-turn').style.display = 'inline-block';
            startTimer(); 
        }

        function nobodySteals() {
            document.getElementById('steal-modal').style.display = 'none';
            const correctBtn = document.getElementById('opt-' + currentActiveBox.correct);
            if(correctBtn) correctBtn.classList.add('correct');
            setTimeout(processTurnEnd, 2000);
        }

        function processTurnEnd() {
            clearInterval(timer);
            document.body.classList.remove('time-warning');
            openedBoxesCount++; 
            showGridScreen();
        }

        function use5050() {
            teams[mainTurnIdx].l5050 = true; updateLifelinesUI();
            let wrongIndices = [];
            const correctIdx = currentActiveBox.correct;
            for(let i=0; i<4; i++) { if(i !== correctIdx) wrongIndices.push(i); }
            wrongIndices.sort(() => Math.random() - 0.5);
            wrongIndices.slice(0, 2).forEach(idx => {
                const btn = document.getElementById('opt-' + idx);
                btn.classList.add('disabled-5050'); btn.disabled = true;
            });
        }
        function useCall() {
            teams[mainTurnIdx].lCall = true; updateLifelinesUI();
            const ans = ['A', 'B', 'C', 'D'][currentActiveBox.correct];
            document.getElementById('call-content').innerHTML = `📞 Friend: "I'm 100% sure the answer is <b>${ans}</b>!"`;
            document.getElementById('call-modal').style.display = 'flex';
        }
        function useAudience() {
            teams[mainTurnIdx].lAudience = true; updateLifelinesUI();
            const correctIdx = currentActiveBox.correct;
            const letters = ['A', 'B', 'C', 'D'];
            let html = `Audience Votes:<br><br>`;
            letters.forEach((l, idx) => {
                let percent = (idx === correctIdx) ? 75 : Math.floor(Math.random() * 10);
                html += `Option ${l}: <b style="color:var(--accent2);">${percent}%</b><br>`;
            });
            document.getElementById('call-content').innerHTML = html;
            document.getElementById('call-modal').style.display = 'flex';
        }

        function showGiftModal() {
            playSound('sfx-tada');
            document.getElementById('gift-modal').style.display = 'flex';
            document.getElementById('gift-options-box').style.display = 'flex';
            document.getElementById('gift-result').style.display = 'none';
            document.getElementById('close-modal-btn').style.display = 'none';
        }

        function openComboGift() {
            if (availableComboGifts.length === 0) availableComboGifts = [...comboGifts];
            const randIdx = Math.floor(Math.random() * availableComboGifts.length);
            const g = availableComboGifts[randIdx];
            availableComboGifts.splice(randIdx, 1);
            
            g.f();
            document.getElementById('gift-options-box').style.display = 'none';
            const resEl = document.getElementById('gift-result');
            resEl.innerText = g.t; resEl.style.color = g.color; resEl.style.display = 'block';
            document.getElementById('close-modal-btn').style.display = 'inline-block';
            updateScoreboard();
        }

        function closeGiftModal() {
            document.getElementById('gift-modal').style.display = 'none';
            processTurnEnd(); 
        }

        // END GAME & TIERS LOGIC
        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            fireConfetti(); setInterval(fireConfetti, 3000); 
            
            let sorted = [...teams].sort((a, b) => b.score - a.score);
            let html = '';
            
            sorted.forEach((t, i) => {
                let posText = '', actionHTML = '', tierClass = '';
                
                if(i === 0) {
                    posText = "1ST"; tierClass = "tier-1";
                    actionHTML = `🏆 CHAMPION! Claim your physical prize from the teacher!`;
                } else if(i === 1) {
                    posText = "2ND"; tierClass = "tier-2";
                    actionHTML = `🎁 <button class="secret-btn" onclick="revealVideo('reward')">WATCH REWARD VIDEO</button>`;
                } else if(i === 2) {
                    posText = "3RD"; tierClass = "tier-3";
                    actionHTML = `💀 <button class="secret-btn" onclick="revealVideo('punish')">WATCH PUNISHMENT VIDEO</button>`;
                } else {
                    posText = "4TH"; tierClass = "tier-4";
                    actionHTML = `🧹 ULTIMATE PUNISHMENT: You must clean the whiteboard and sing Baby Shark!`;
                }

                html += `
                <div class="rank-tier ${tierClass}">
                    <div class="rank-pos">${posText}</div>
                    <div class="rank-details">
                        <div class="rank-name">${t.name}</div>
                        <div class="rank-score">${t.score} Points</div>
                        <div class="rank-action">${actionHTML}</div>
                    </div>
                </div>`;
            });
            document.getElementById('rank-board').innerHTML = html;
        }

        function revealVideo(type) {
            let videoFile = type === 'reward' ? './reward.mp4' : './punish.mp4';
            
            const videoEl = document.createElement('video');
            videoEl.src = videoFile;
            videoEl.controls = true;
            videoEl.style.position = 'fixed';
            videoEl.style.top = '0';
            videoEl.style.left = '0';
            videoEl.style.width = '100vw';
            videoEl.style.height = '100vh';
            videoEl.style.backgroundColor = 'black';
            videoEl.style.zIndex = '9999';

            document.body.appendChild(videoEl);

            videoEl.play();

            if (videoEl.requestFullscreen) {
                videoEl.requestFullscreen();
            } else if (videoEl.webkitRequestFullscreen) {
                videoEl.webkitRequestFullscreen();
            } else if (videoEl.msRequestFullscreen) {
                videoEl.msRequestFullscreen();
            }

            videoEl.onended = () => { document.exitFullscreen(); videoEl.remove(); };
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && document.body.contains(videoEl)) videoEl.remove();
            });
        }
    </script>
</body>
</html>
