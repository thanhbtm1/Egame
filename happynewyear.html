<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            max-width: 500px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #ff4757;
            font-size: 2rem;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite alternate;
        }

        p {
            color: #57606f;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            margin-bottom: 15px;
        }

        .btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        /* Khung chứa danh sách ảnh */
        .img-container {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.6s ease-in-out, opacity 0.5s ease-in-out;
            margin-top: 10px;
            
            /* Dạng lưới chia 2 cột cho nhiều ảnh */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* Lớp CSS được thêm vào bằng JS khi bấm nút */
        .img-container.show {
            max-height: 1000px; /* Mở rộng chiều cao để chứa nhiều ảnh */
            opacity: 1;
        }

        .img-container img {
            width: 100%;
            height: 150px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* Hiệu ứng kim tuyến */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Chúc e sinh nhựt vui vẻ nha bitch ✨</p>
        
        <button class="btn" onclick="toggleImage()">qua cho iem ne 🎁</button>

        <!-- Khung hiện danh sách nhiều ảnh -->
        <div class="img-container" id="myImageContainer">
            <!-- Bạn chỉ cần thay link trong thuộc tính src thành tên file của bạn (ví dụ: src="anh1.jpg") -->
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=600" alt="Ảnh sinh nhật 1">
            <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?q=80&w=600" alt="Ảnh sinh nhật 2">
            <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?q=80&w=600" alt="Ảnh sinh nhật 3">
            <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?q=80&w=600" alt="Ảnh sinh nhật 4">
        </div>
    </div>

    <script>
        function toggleImage() {
            const imgContainer = document.getElementById('myImageContainer');
            // Thêm hoặc xóa class 'show' để hiện/ẩn danh sách ảnh
            imgContainer.classList.toggle('show');
        }

        // Tạo hiệu ứng kim tuyến rơi
        function createConfetti() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#e84393'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
            }
        }

        createConfetti();
    </script>
</body>
</html>
